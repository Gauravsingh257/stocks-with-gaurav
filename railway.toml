# Railway configuration — auto-detected by Railway at repo root.
# This file replaces railway-web.toml (which requires manual config path setup).

[build]
# Use the slim Dockerfile so Railway installs requirements-railway.txt (not full deps)
dockerfilePath = "Dockerfile"

# Only changes to code or data this service can load trigger a redeploy — so docs,
# the Vercel frontend, tests, CI config and the nightly bot data commits
# (signal_history/**, docs/validation/**) no longer restart it. Derived on
# 2026-09-27 from a static import graph of the service entry point (including
# lazy in-function imports and `python -m scripts.*` subprocesses): engine, web
# and scanner all import across these same packages, so the list is shared and
# deliberately generous — a MISSING path means the service silently runs stale
# code, which is worse than an extra restart. Add a new top-level package here.
watchPatterns = [
  "/*.py",
  "/agents/**",
  "/ai_learning/**",
  "/backtest/**",
  "/config/**",
  "/dashboard/__init__.py",
  "/dashboard/backend/**",
  "/data/**",
  "/engine/**",
  "/models/**",
  "/scripts/**",
  "/services/**",
  "/signals/**",
  "/smc_trading_engine/**",
  "/strategies/**",
  "/utils/**",
  "/stock_universe_500.json",
  "/stock_universe_fno.json",
  "/Dockerfile",
  "/requirements-railway.txt",
  "/railway.toml",
]

[deploy]
startCommand = "python scripts/start_web.py"
healthcheckPath = "/health"
# 300s: lifespan blocks on slow external calls (Kite broker API,
# scheduler init) at startup. Diagnosed by Railway 2026-05-20 after
# /health timed out at 120s when Kite was slow. 300s gives lifespan
# room to complete without aborting the deploy.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
