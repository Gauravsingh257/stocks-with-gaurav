# Railway configuration — auto-detected by Railway at repo root.
# This file replaces railway-web.toml (which requires manual config path setup).

[build]
# Use the slim Dockerfile so Railway installs requirements-railway.txt (not full deps)
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python scripts/start_web.py"
healthcheckPath = "/health"
# 300s: lifespan blocks on slow external calls (Kite broker API,
# scheduler init) at startup. Diagnosed by Railway 2026-05-20 after
# /health timed out at 120s when Kite was slow. 300s gives lifespan
# room to complete without aborting the deploy.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
