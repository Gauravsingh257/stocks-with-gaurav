# Scanner producer worker — set "Config file path" to railway-scanner.toml in Railway dashboard.
#
# Separate from the live trading engine (isolation): it only reads the Kite token
# from Redis and writes scanner:* snapshots. It does NOT serve HTTP and does NOT
# touch trade state, so it has no healthcheck (worker service).
#
# Uses Dockerfile.scanner whose CMD is the scanner cron loop — so the start
# command lives in code and this service can NEVER boot the live trading engine.
# Runs in --loop mode: one run on boot, a post-close run each weekday ~15:45 IST,
# and optional intraday refreshes when SCANNER_INTRADAY_REFRESH=1.
#
# Required env (share with the engine service):
#   REDIS_URL, KITE_API_KEY  (token is read from Redis key kite:access_token)
# Optional:
#   SCANNER_MODE=liquid|full          (default liquid)
#   SCANNER_INTRADAY_REFRESH=0|1      (default 0 — confirmed-at-close only)
#   SCANNER_INTRADAY_MIN=30           (minutes between intraday refreshes)

[build]
dockerfilePath = "Dockerfile.scanner"

# Only changes to code or data this service can load trigger a redeploy — so docs,
# the Vercel frontend, tests, CI config and the nightly bot data commits
# (signal_history/**, docs/validation/**) no longer restart it. Derived on
# 2026-09-27 from a static import graph of the service entry point (including
# lazy in-function imports and `python -m scripts.*` subprocesses): engine, web
# and scanner all import across these same packages, so the list is shared and
# deliberately generous — a MISSING path means the service silently runs stale
# code, which is worse than an extra restart. Add a new top-level package here.
watchPatterns = [
  "/*.py",
  "/agents/**",
  "/ai_learning/**",
  "/backtest/**",
  "/config/**",
  "/dashboard/__init__.py",
  "/dashboard/backend/**",
  "/data/**",
  "/engine/**",
  "/models/**",
  "/scripts/**",
  "/services/**",
  "/signals/**",
  "/smc_trading_engine/**",
  "/strategies/**",
  "/utils/**",
  "/stock_universe_500.json",
  "/stock_universe_fno.json",
  "/Dockerfile.scanner",
  "/requirements-engine.txt",
  "/railway-scanner.toml",
]

[deploy]
startCommand = "python -m scripts.scanner_cron --loop"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
